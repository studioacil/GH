<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GH — autotest OCR</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #05060a; color: #f2f2f7; padding: 18px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.1rem; }
  .stage { font-family: ui-monospace, monospace; font-size: .85rem; padding: 10px 12px; border-radius: 10px; margin: 8px 0; background: #101018; border-left: 5px solid #555; white-space: pre-wrap; }
  .ok { border-left-color: #30d158; } .ko { border-left-color: #ff453a; color: #ffb3ae; }
  button { font: inherit; font-weight: 700; padding: 12px 18px; border-radius: 12px; border: none; background: #5ac8fa; color: #04121c; }
  #out { font-family: ui-monospace, monospace; font-size: .75rem; background: #0a0a10; padding: 10px; border-radius: 10px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>🧪 Autotest OCR GH</h1>
<p>Ouvre cette page sur le téléphone qui teste (iPhone 12 mini / Pixel 7a), appuie sur le bouton, et dis-moi où ça passe au rouge.</p>
<button id="run">▶ Lancer le test OCR</button>
<div id="stages"></div>
<h3>Texte reconnu</h3>
<div id="out">—</div>

<script>
  const VB = location.pathname.replace(/maquette-ocr.*$/, '');
</script>
<script src="../vendor/tesseract/tesseract.min.js"></script>
<script>
const stages = document.getElementById('stages');
function stage(name, ok, msg) {
  const d = document.createElement('div');
  d.className = 'stage ' + (ok ? 'ok' : 'ko');
  d.textContent = (ok ? '✅ ' : '❌ ') + name + (msg ? ' — ' + msg : '');
  stages.appendChild(d);
}
document.getElementById('run').addEventListener('click', async () => {
  stages.innerHTML = '';
  // 1. lib chargée ?
  stage('1. tesseract.min.js chargé (window.Tesseract)', !!window.Tesseract, window.Tesseract ? 'v' + (window.Tesseract.version || '?') : 'ABSENT');
  if (!window.Tesseract) return;
  // 2. image de test dessinée (offre fictive)
  const c = document.createElement('canvas');
  c.width = 780; c.height = 400;
  const x = c.getContext('2d');
  x.fillStyle = '#1c1c1e'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#fff'; x.textAlign = 'center';
  x.font = '700 40px -apple-system, sans-serif'; x.fillText('Nouvelle offre', 390, 70);
  x.font = '800 100px -apple-system, sans-serif'; x.fillStyle = '#30d158'; x.fillText('12,40 €', 390, 190);
  x.fillStyle = '#fff'; x.font = '600 40px -apple-system, sans-serif';
  x.fillText('5 min  ·  3,2 km', 390, 270);
  x.fillText('12 rue de la République, Lyon', 390, 340);
  stage('2. image de test dessinée', c.width > 0, c.width + 'x' + c.height);
  // 3. worker
  let worker;
  try {
    worker = await Tesseract.createWorker(['eng'], 1, {
      workerPath: VB + 'vendor/tesseract/worker.min.js',
      corePath: VB + 'vendor/tesseract',
      langPath: VB + 'vendor/tesseract/lang',
      gzip: false,
    });
    stage('3. worker créé + langue chargée', true);
  } catch (e) {
    stage('3. worker créé + langue chargée', false, (e && e.message) || String(e));
    return;
  }
  // 4. reconnaissance (canvas inversé comme dans l'app)
  try {
    const off = document.createElement('canvas');
    off.width = c.width; off.height = c.height;
    const ox = off.getContext('2d');
    ox.drawImage(c, 0, 0);
    const d = ox.getImageData(0, 0, off.width, off.height);
    for (let i = 0; i < d.data.length; i += 4) { d.data[i] = 255 - d.data[i]; d.data[i+1] = 255 - d.data[i+1]; d.data[i+2] = 255 - d.data[i+2]; }
    ox.putImageData(d, 0, 0);
    const r = await worker.recognize(off);
    document.getElementById('out').textContent = r.data.text;
    const ok = /12[,.]40/.test(r.data.text) && /min/.test(r.data.text);
    stage('4. reconnaissance OCR', ok, JSON.stringify(r.data.text.slice(0, 80)));
  } catch (e) {
    stage('4. reconnaissance OCR', false, (e && e.message) || String(e));
  }
  try { await worker.terminate(); } catch (e) {}
});
</script>
</body>
</html>
